name: Push to Replicate
on: {workflow_dispatch: {inputs: {model_name: {description: "Enter the model name, like your-username/text-clone-voice", required: true}}}}
jobs: {push_to_replicate: {name: "Push to Replicate", runs-on: ubuntu-latest, steps: [{name: "Free disk space", uses: "jlumbroso/free-disk-space@v1.3.1", with: {tool-cache: false, docker-images: false}}, {name: "Checkout", uses: "actions/checkout@v4"}, {name: "Setup Cog", uses: "replicate/setup-cog@v2", with: {token: "${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}"}}, {name: "Write HF token", run: "echo \"$HF_TOKEN\" > /tmp/hf_token", env: {HF_TOKEN: "${{ secrets.HF_TOKEN }}"}}, {name: "Push to Replicate", run: "cog push r8.im/${{ inputs.model_name }} --secret id=hf_token,src=/tmp/hf_token"}]}}
